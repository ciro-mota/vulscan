include:
  - template: Jobs/Container-Scanning.gitlab-ci.yml

default:
  image: docker:29.10@sha256:fbbc96e0af32cdc190aff92ba97a1281a115351a723afe21af78879cc55126b0

services:
  - docker:29.10-dind@sha256:4bbc7223f81db790097c6dea42fb93e05b8fead4f0431fbe6ccaba6e8473201c

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_CHANGED_PATHS == "Dockerfile"'
      when: always

    - if: '$CI_PIPELINE_SOURCE == "push"'
      when: always
      changes:
        - Dockerfile
    
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: always
    
    - when: never

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  IMAGE_TAG: ciromota/vulscan-nmap:$CI_COMMIT_SHA

stages:
  - build
  - lint
  - test
  - scan
  - deploy

Build:
  stage: build
  script:
    - docker build --cache-from ciromota/vulscan-nmap:latest -t $IMAGE_TAG .
    - docker tag $IMAGE_TAG ciromota/vulscan-nmap:latest

Lint:
  stage: lint
  image: hadolint/hadolint:latest-debian@sha256:9a3944b7fddcb947d1ffd90829ac1a6e5c30479223358f249d8b96c7d0019e27
  script:
    - hadolint Dockerfile

Test:
  stage: test
  before_script:
    - docker build --cache-from ciromota/vulscan-nmap:latest -t $IMAGE_TAG .
  script:
    - docker container run --rm --privileged $IMAGE_TAG --version
  after_script:
    - echo "Container test completed successfully"

container_scanning:
  stage: scan
  variables:
    CS_IMAGE: ciromota/vulscan-nmap:latest

