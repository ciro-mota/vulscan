name: Docker Vulscan CI

permissions:
  contents: write
  id-token: write
  packages: write
  security-events: write

run-name: ${{ github.event_name == 'schedule' && 'Scheduled Weekly Build' || github.event.inputs.manual_commit_message || github.event.head_commit.message }}

on:
  push:
    paths:
     - 'Dockerfile'
  schedule:
    - cron: '33 3 * * 1'
  workflow_dispatch:
    inputs:
      manual_commit_message:
        description: "Insert manual commit message"
        type: string
        required: true

jobs:
  Build:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd
    
    - name: Build Docker Image
      uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294
      env:
        DOCKER_BUILD_SUMMARY: false
      with:
        context: .
        push: false
        load: true

  Test:
    runs-on: ubuntu-24.04
    needs: Build

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

    - name: Lint Dockerfile
      uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5
      with:
        dockerfile: Dockerfile
        config: .hadolint.yaml

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd
    
    - name: Build Docker Image
      uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294
      env:
        DOCKER_BUILD_SUMMARY: false
      with:
        context: .
        push: false
        load: true
        tags: ciromota/vulscan-nmap:latest

    - name: Run Trivy vulnerability scanner
      id: scan
      uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
      with:
        image-ref: ciromota/vulscan-nmap:latest
        format: sarif
        output: trivy-results.sarif
        severity: CRITICAL,HIGH,MEDIUM,LOW
        exit-code: 0
        version: latest
    
    - name: Install Trivy CLI to generate GITHUB_STEP_SUMMARY
      run: |
        curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
    
    - name: Publish Scan Summary into GITHUB_STEP_SUMMARY
      run: |
        echo "## Trivy Vulnerability Scan Summary" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        trivy image --format table ciromota/vulscan-nmap:latest >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
    
    - name: Upload Trivy report to GitHub Security
      uses: github/codeql-action/upload-sarif@38697555549f1db7851b81482ff19f1fa5c4fedc
      with:
        sarif_file: trivy-results.sarif
        category: trivy-container-scan

  Push:
    needs: Test
    runs-on: ubuntu-24.04

    steps:
    - name: Check out the repo
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

    - name: Install Cosign
      uses: sigstore/cosign-installer@ba7bc0a3fef59531c69a25acd34668d6d3fe6f22

    - name: Docker Registry Login
      uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2
      with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
    - name: GitHub Container Registry Login
      uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata for Docker
      id: docker_meta
      uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf
      with:
          images: |
            ciromota/vulscan-nmap
            ghcr.io/ciro-mota/vulscan-nmap
          tags: type=sha,format=long
          flavor: |
            latest=true

    - name: Build and Push Docker image
      uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294
      env:
        DOCKER_BUILD_SUMMARY: false
      id: build-and-push
      with:
          context: .
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}

    - name: Sign image with Cosign
      env:
        TAGS: ${{ steps.docker_meta.outputs.tags }}
        COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
        COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        DIGEST: ${{ steps.build-and-push.outputs.digest }}
      run: |
          images=""
          for tag in ${TAGS}; do
            images+="${tag}@${DIGEST} "
          done
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY ${images}

  Automatic-commit:
    needs: Push
    runs-on: ubuntu-24.04
    if: github.event_name == 'schedule'

    steps:
    - name: Check out the repo
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

    - name: Create build timestamp
      run: |
        echo "Last successful build: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" > .last-build
    
    - name: Commit and push changes
      uses: stefanzweifel/git-auto-commit-action@04702edda442b2e678b25b537cec683a1493fcb9
      with:
        commit_message: "chore: automated weekly build completed [skip ci]"
        file_pattern: '.last-build'
        commit_user_name: github-actions[bot]
        commit_user_email: github-actions[bot]@users.noreply.github.com
        commit_author: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
