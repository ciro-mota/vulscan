name: Docker Vulscan CI

permissions:
  contents: write
  id-token: write
  packages: write
  security-events: write

run-name: ${{ github.event_name == 'schedule' && 'Scheduled Weekly Build' || github.event.inputs.manual_commit_message || github.event.head_commit.message }}

on:
  push:
    paths:
     - 'Dockerfile'
  schedule:
    - cron: '33 3 * * 1'
  workflow_dispatch:
    inputs:
      manual_commit_message:
        description: "Insert manual commit message"
        type: string
        required: true

jobs:
  Build:
    runs-on: ubuntu-26.04

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
    
    - name: Build Docker Image
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
      env:
        DOCKER_BUILD_SUMMARY: false
      with:
        context: .
        push: false
        load: true

  Test:
    runs-on: ubuntu-26.04
    needs: Build

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: Lint Dockerfile
      uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5
      with:
        dockerfile: Dockerfile
        config: .hadolint.yaml

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
    
    - name: Build Docker Image
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
      env:
        DOCKER_BUILD_SUMMARY: false
      with:
        context: .
        push: false
        load: true
        tags: ciromota/vulscan-nmap:latest

    - name: Run Trivy vulnerability scanner
      id: scan
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
      with:
        image-ref: ciromota/vulscan-nmap:latest
        format: sarif
        output: trivy-results.sarif
        severity: CRITICAL,HIGH,MEDIUM,LOW
        exit-code: 0
        version: latest
    
    - name: Install Trivy CLI to generate GITHUB_STEP_SUMMARY
      run: |
        curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
    
    - name: Publish Scan Summary into GITHUB_STEP_SUMMARY
      run: |
        echo "## Trivy Vulnerability Scan Summary" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        trivy image --format table ciromota/vulscan-nmap:latest >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
    
    - name: Upload Trivy report to GitHub Security
      uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81
      with:
        sarif_file: trivy-results.sarif
        category: trivy-container-scan

  Push:
    needs: Test
    runs-on: ubuntu-26.04

    steps:
    - name: Check out the repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: Install Cosign
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6

    - name: Docker Registry Login
      uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7
      with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          
    - name: GitHub Container Registry Login
      uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata for Docker
      id: docker_meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
      with:
          images: |
            ciromota/vulscan-nmap
            ghcr.io/ciro-mota/vulscan-nmap
          tags: type=sha,format=long
          flavor: |
            latest=true

    - name: Build and Push Docker image
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
      env:
        DOCKER_BUILD_SUMMARY: false
      id: build-and-push
      with:
          context: .
          push: true
          tags: ${{ steps.docker_meta.outputs.tags }}

    - name: Sign image with Cosign
      env:
        TAGS: ${{ steps.docker_meta.outputs.tags }}
        COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
        COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        DIGEST: ${{ steps.build-and-push.outputs.digest }}
      run: |
          images=""
          for tag in ${TAGS}; do
            images+="${tag}@${DIGEST} "
          done
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY ${images}

  Automatic-commit:
    needs: Push
    runs-on: ubuntu-26.04
    if: github.event_name == 'schedule'

    steps:
    - name: Check out the repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: Create build timestamp
      run: |
        echo "Last successful build: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" > .last-build
    
    - name: Commit and push changes
      uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d
      with:
        commit_message: "chore: automated weekly build completed [skip ci]"
        file_pattern: '.last-build'
        commit_user_name: github-actions[bot]
        commit_user_email: github-actions[bot]@users.noreply.github.com
        commit_author: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
