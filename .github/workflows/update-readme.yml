name: Update README in Docker Hub

permissions:
  contents: read
  id-token: write

run-name: ${{ github.event.inputs.manual_commit_message || 'Update README in Docker Hub' }}

on:
  push:
    paths:
     - 'README.md'
  workflow_dispatch:
    inputs:
      manual_commit_message:
        description: "Insert manual commit message"
        type: string
        required: true

jobs:
  Update:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

    - name: Docker Hub Description
      uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa
      with:
        username: ${{ secrets.DOCKER_USER }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
        repository: ciromota/vulscan-nmap
        readme-filepath: ./README.md
        short-description: ${{ github.event.repository.description }}
        