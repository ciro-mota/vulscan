name: Renovate Scheduled Automerge

on:
  schedule:
    - cron: "33 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  automerge:
    runs-on: ubuntu-26.04
    steps:
      - name: Automerge Renovate PRs and trigger build
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;

            const prs = await github.paginate(
              github.rest.pulls.list,
              { owner, repo, state: "open", per_page: 100 }
            );

            const merged = [];
            let imageChanged = false;

            for (const pr of prs) {
              const isRenovate = pr.user.login === "renovate[bot]";
              const labels = pr.labels.map(l => l.name);
              const hasAutomerge = labels.includes("automerge");
              const isManualReview = labels.includes("manual-review");
              const isMajor = labels.includes("major-update");

              if (!isRenovate) continue;
              if (!hasAutomerge) continue;
              if (isManualReview || isMajor) {
                console.log(`Skipping #${pr.number}, manual review required`);
                continue;
              }

              try {
                const files = await github.paginate(
                  github.rest.pulls.listFiles,
                  { owner, repo, pull_number: pr.number, per_page: 100 }
                );

                const affectsImage = files.some(f =>
                  f.filename === "Dockerfile" || f.filename.startsWith("app/")
                );

                console.log(`Trying merge for #${pr.number}`);

                await github.rest.pulls.merge({
                  owner,
                  repo,
                  pull_number: pr.number,
                  merge_method: "squash"
                });

                console.log(`Merged #${pr.number}`);
                merged.push(pr.number);

                if (affectsImage) {
                  imageChanged = true;
                }
              } catch (err) {
                console.log(`Skipping #${pr.number}: ${err.message}`);
              }
            }

            if (merged.length === 0) {
              console.log("No PR merged; the build will not be triggered.");
              return;
            }

            if (!imageChanged) {
              console.log("Merged PRs do not change the image; the build will not be triggered.");
              return;
            }

            const list = merged.map(n => `#${n}`).join(", ");

            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: "docker-publish.yml",
              ref: "main",
              inputs: {
                manual_commit_message: `Renovate: weekly update (${list})`
              }
            });

            console.log(`Build launched for ${list}`);